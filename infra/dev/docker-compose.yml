name: events2mqtt-dev

services:
  claude:
    container_name: events2mqtt-dev-claude
    hostname: events2mqtt-claude
    build: ./docker/claude
    image: events2mqtt-dev-claude
    volumes:
      - ../..:/workspace
      - claude-home:/root
      - ./data/claude:/root/.claude
      - ./data/ssh:/root/.ssh
      - ${HOME}/.claude/skills:/root/.claude/skills
    working_dir: /workspace
    healthcheck:
      # Healthy once the entrypoint has generated the SSH key pair.
      test: ["CMD", "test", "-f", "/root/.ssh/id_rsa.pub"]
      interval: 30s
      start_period: 30s
      start_interval: 1s
    networks:
      - events2mqtt-dev-network

  mosquitto:
    build: ./docker/mosquitto
    image: events2mqtt-dev-mosquitto
    container_name: events2mqtt-dev-mosquitto
    hostname: events2mqtt-mosquitto
    depends_on:
      claude:
        condition: service_healthy
    volumes:
      - ./data/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./data/ssh/id_rsa.pub:/tmp/claude_id_rsa.pub:ro
      - mosquitto-ssh:/etc/ssh
    ports:
      - "1883:1883"
    networks:
      - events2mqtt-dev-network

  go:
    build: ./docker/go
    image: events2mqtt-dev-go
    container_name: events2mqtt-dev-go
    hostname: events2mqtt-go
    depends_on:
      claude:
        condition: service_healthy
    volumes:
      - ../..:/workspace
      - ./data/ssh/id_rsa.pub:/tmp/claude_id_rsa.pub:ro
      - go-ssh:/etc/ssh
      - go-path:/go
      - go-build-cache:/root/.cache/go-build
    networks:
      - events2mqtt-dev-network

networks:
  events2mqtt-dev-network:
    driver: bridge

volumes:
  claude-home:
  mosquitto-ssh:
  go-ssh:
  go-path:
  go-build-cache:
